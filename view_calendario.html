<div class="container-fluid p-4 studio-shell">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h3 class="d-flex align-items-center gap-2 mb-0">
      <i class="bi bi-calendar3 text-primary"></i>
      Calendario
    </h3>
    <button class="btn btn-primary" onclick="abrirModalCalendario()">
      <i class="bi bi-plus-circle me-1"></i>
      Nuevo evento
    </button>
  </div>

  <div class="table-scroll">
    <table class="table table-striped table-hover mb-0" id="tblCalendarioAdmin">
      <thead></thead>
      <tbody></tbody>
    </table>
  </div>
</div>

<div class="modal fade" id="modalCalendario" tabindex="-1">
  <div class="modal-dialog modal-lg modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Calendario</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="calRowNumber">
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label">Módulo</label>
            <input id="calModulo" class="form-control">
          </div>
          <div class="col-md-6">
            <label class="form-label">Actividades (RQ)</label>
            <input id="calActividades" class="form-control">
          </div>
          <div class="col-md-6">
            <label class="form-label">Sprint</label>
            <input id="calSprint" class="form-control">
          </div>
          <div class="col-md-6">
            <label class="form-label">Inicio</label>
            <input id="calInicio" type="datetime-local" class="form-control">
          </div>
          <div class="col-12">
            <label class="form-label">Fin</label>
            <input id="calFin" type="datetime-local" class="form-control">
          </div>
          <div class="col-12">
            <label class="form-label">Duración</label>
            <input id="calDuracion" class="form-control">
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
        <button id="btnGuardarCalendario" class="btn btn-primary" onclick="guardarEventoCalendario()">Guardar</button>
      </div>
    </div>
  </div>
</div>
