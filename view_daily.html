<div class="container-fluid p-4 studio-shell">
  <div class="d-flex justify-content-between align-items-center gap-2 mb-3">
    <div>
      <h3 class="d-flex align-items-center gap-2 mb-0">
        <i class="bi bi-calendar2-check text-primary"></i>
        Daily Scrum
      </h3>
      <div class="text-muted small">Registro diario del equipo y resumen de ayuda.</div>
    </div>

    <div class="d-flex gap-2">
      <button class="btn btn-dark" onclick="abrirModalExportInforme()">
        <i class="bi bi-file-earmark-pdf-fill me-1"></i>
        Exportar informe
      </button>

      <button class="btn btn-primary" onclick="abrirModalDailyScrum()">
        <i class="bi bi-plus-circle me-1"></i>
        Registrar daily
      </button>
    </div>
  </div>

  <div class="row g-3 mb-3">
    <div class="col-12">
      <div class="card shadow-sm border-0">
        <div class="card-body">
          <div class="d-flex justify-content-between align-items-center mb-2">
            <h5 class="card-title mb-0">
              <i class="bi bi-chat-quote me-1 text-primary"></i>
              Necesito ayuda
            </h5>
            <span id="dailyHelpCount" class="badge text-bg-primary">0</span>
          </div>
          <div id="dailyHelpTotals" class="small text-muted mb-2"></div>
          <div id="dailyHelpSummary" class="row g-2"></div>
        </div>
      </div>
    </div>
  </div>

  <div class="table-scroll">
    <table class="table table-striped table-hover mb-0" id="tblDailyScrum">
      <thead>
        <tr>
          <th></th>
          <th>Fecha</th>
          <th>Usuario</th>
          <th>Rol</th>
          <th>Avance hoy</th>
          <th>Próximo paso</th>
          <th>Bloqueo</th>
          <th>Necesito ayuda</th>
          <th>Actualizado</th>
          <th style="min-width:180px;">Acciones</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>
</div>

<div
  class="modal fade"
  id="modalExportInforme"
  tabindex="-1"
>
  <div class="modal-dialog modal-lg modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title d-flex align-items-center gap-2">
          <i class="bi bi-journal-richtext text-primary"></i>
          Exportar informe de desarrollo
        </h5>
        <button
          type="button"
          class="btn-close"
          data-bs-dismiss="modal"
        ></button>
      </div>

      <div class="modal-body">
        <div class="row g-3">
          <div class="col-12">
            <label class="form-label fw-bold">Rango de fechas</label>
          </div>
          <div class="col-md-6">
            <label for="repFromDate" class="form-label">Desde</label>
            <input id="repFromDate" type="date" class="form-control">
          </div>
          <div class="col-md-6">
            <label for="repToDate" class="form-label">Hasta</label>
            <input id="repToDate" type="date" class="form-control">
          </div>

          <div class="col-12">
            <label class="form-label fw-bold">Alcance</label>
            <select id="repScope" class="form-select">
              <option value="SELECTED">Solo seleccionadas en tabla</option>
              <option value="FILTERED" selected>Todas las filtradas</option>
              <option value="DATE_RANGE">Todas por rango de fechas</option>
            </select>
          </div>

          <div class="col-12">
            <label class="form-label fw-bold">Contenido a incluir</label>
            <div class="form-check">
              <input id="repIncludeDaily" class="form-check-input" type="checkbox" checked>
              <label class="form-check-label" for="repIncludeDaily">Daily scrum</label>
            </div>
            <div class="form-check">
              <input id="repIncludeTasks" class="form-check-input" type="checkbox">
              <label class="form-check-label" for="repIncludeTasks">Tareas asignadas</label>
            </div>
            <div class="form-check">
              <input id="repIncludeObs" class="form-check-input" type="checkbox">
              <label class="form-check-label" for="repIncludeObs">Observaciones realizadas</label>
            </div>
            <div class="form-check">
              <input id="repIncludeChats" class="form-check-input" type="checkbox">
              <label class="form-check-label" for="repIncludeChats">Chat y decisiones</label>
            </div>
            <div class="form-check">
              <input id="repIncludeImages" class="form-check-input" type="checkbox">
              <label class="form-check-label" for="repIncludeImages">Evidencias de imagen</label>
            </div>
            <div class="form-check">
              <input id="repIncludeHistory" class="form-check-input" type="checkbox">
              <label class="form-check-label" for="repIncludeHistory">Historial de estados</label>
            </div>
          </div>

          <div class="col-md-6">
            <label for="repGroupBy" class="form-label fw-bold">Agrupacion</label>
            <select id="repGroupBy" class="form-select">
              <option value="RESPONSABLE" selected>Por responsable</option>
              <option value="ESTADO">Por estado</option>
              <option value="PRIORIDAD">Por prioridad</option>
              <option value="TIPO">Por tipo</option>
            </select>
          </div>

          <div class="col-md-6">
            <label for="repDetailLevel" class="form-label fw-bold">Formato del informe</label>
            <select id="repDetailLevel" class="form-select">
              <option value="RESUMEN">Resumen ejecutivo</option>
              <option value="DETALLADO" selected>Detallado</option>
              <option value="DETALLADO_CHAT">Detallado + chat completo</option>
            </select>
          </div>
        </div>
      </div>

      <div class="modal-footer">
        <button class="btn btn-outline-secondary" data-bs-dismiss="modal">
          <i class="bi bi-x-circle me-1"></i>
          Cancelar
        </button>
        <button class="btn btn-info" onclick="previewInformeDesarrollo()">
          <i class="bi bi-eye me-1"></i>
          Vista previa
        </button>
        <button class="btn btn-dark" onclick="descargarInformeDesarrolloPdf()">
          <i class="bi bi-download me-1"></i>
          Descargar PDF
        </button>
      </div>
    </div>
  </div>
</div>

<div class="modal fade" id="modalDailyScrum" tabindex="-1" data-bs-backdrop="static" data-bs-keyboard="true">
  <div class="modal-dialog modal-xl modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Daily Scrum</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body" id="dailyModalBody">
        <input type="hidden" id="dailyId">
        <input type="hidden" id="dailyFecha">
        <div class="row g-3 mb-3">
          <div class="col-md-6">
            <label class="form-label">Usuario</label>
            <input id="dailyUsuario" class="form-control" readonly>
          </div>
          <div class="col-md-3">
            <label class="form-label">Rol</label>
            <input id="dailyRol" class="form-control" readonly>
          </div>
          <div class="col-md-3">
            <label class="form-label">Fecha</label>
            <input id="dailyFechaLabel" class="form-control" readonly>
          </div>
        </div>

        <div class="row g-3">
          <div class="col-12">
            <label class="form-label fw-bold">¿Qué avancé hoy?</label>
            <textarea id="dailyAvanceHoy" class="form-control" rows="3" placeholder="Describe lo avanzado hoy"></textarea>
          </div>
          <div class="col-12">
            <label class="form-label fw-bold">¿Qué haré después?</label>
            <textarea id="dailyProximoPaso" class="form-control" rows="3" placeholder="Describe el siguiente paso"></textarea>
          </div>
          <div class="col-12">
            <label class="form-label fw-bold">¿Tengo algún bloqueo?</label>
            <textarea id="dailyBloqueo" class="form-control" rows="3" placeholder="Indica si hay bloqueo, o escribe No tengo bloqueos"></textarea>
          </div>
          <div class="col-12">
            <label class="form-label fw-bold">Necesito ayuda</label>
            <select id="dailyNecesitoAyuda" class="form-select">
              <option value="">Selecciona una opción</option>
              <option value="Si">Si</option>
              <option value="No">No</option>
            </select>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
        <button id="btnGuardarDailyScrum" class="btn btn-primary" onclick="guardarDailyScrum()">
          Guardar daily
        </button>
      </div>
    </div>
  </div>
</div>
