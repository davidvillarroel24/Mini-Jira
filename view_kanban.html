<div class="container-fluid p-4 studio-shell">

  <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
    <h3 class="d-flex align-items-center gap-2 mb-0">
      <i class="bi bi-kanban text-primary"></i>
      Tablero Kanban
    </h3>

    <div class="d-flex align-items-center gap-2">
      <label class="form-label mb-0" for="kanbanSprintSelect">Sprint</label>
      <select id="kanbanSprintSelect" class="form-select form-select-sm" style="min-width:220px;"></select>
      <div class="form-check ms-2 mb-0">
        <input class="form-check-input" type="checkbox" id="kanbanOnlyMine">
        <label class="form-check-label" for="kanbanOnlyMine">Solo asignadas a mi</label>
      </div>
      <button class="btn btn-outline-primary btn-sm" onclick="refreshKanban()">
        <i class="bi bi-arrow-clockwise me-1"></i>
        Refrescar
      </button>
    </div>
  </div>

  <div class="d-flex justify-content-end align-items-center gap-2 mb-2">
    <button
      id="btnScrollKanbanLeft"
      type="button"
      class="btn btn-outline-primary btn-sm btn-scroll-table"
      title="Desplazar Kanban a la izquierda"
    >
      <i class="bi bi-chevron-left"></i>
    </button>
    <button
      id="btnScrollKanbanRight"
      type="button"
      class="btn btn-outline-primary btn-sm btn-scroll-table"
      title="Desplazar Kanban a la derecha"
    >
      <i class="bi bi-chevron-right"></i>
    </button>
  </div>

  <div id="kanbanBoardWrap" class="kanban-board-wrap">
    <div class="kanban-board" id="kanbanBoard"></div>
  </div>
</div>
