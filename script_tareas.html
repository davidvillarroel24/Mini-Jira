  <script>
  function editarTarea(id){

    const task =

      window.dataObservaciones.find(

        x =>

          String(x.ID_OBSERVACION) ===
          String(id)

      );

    if(!task){

      console.error(
        "No se encontró la tarea"
      );

      return;
    }

    showLoading(
      "Cargando tarea..."
    );

    window.taskTemporal =
      task;

    google.script.run

      .withSuccessHandler(html => {

        renderView(html);

        cargarDatosTarea(
          window.taskTemporal
        );

        cargarUsuariosAsignables();

        hideLoading();

      })

      .withFailureHandler(err => {

          title:"Error",

          text:err.message

        });

      })

      .getView(
        "view_tareas_editar"
      );

  <script>  
  function cargarDatosTarea(task){

    window.taskActual = task;
    window.taskEditImageBase64 = "";

    document.getElementById(
      "obsId"
    ).value =
      task.ID_OBSERVACION;

    document.getElementById(
      "obsModuloEdit"
    ).value =
      task.MODULO || "";

    document.getElementById(
      "obsDescEdit"
    ).value =
      task.DESCRIPCION_CORTA || "";

    document.getElementById(
      "obsPasosEdit"
    ).value =
      task.PASOS_REPRODUCIR || "";

    document.getElementById(
      "obsPrioridadEdit"
    ).value =
      task.PRIORIDAD || "MEDIA";

    document.getElementById(
      "obsEstadoEdit"
    ).value =
      task.ESTADO || "";

    // =========================
    // ASIGNACIONES
    // =========================

    let asignaciones = {

      QA: [],
      DEV: [],
      PM: [],
      LIDER_QA: [],
      LIDER_DEV: []

    };

    try{

      if(task.USUARIOS_ASIGNADOS){

        asignaciones =

          JSON.parse(
            task.USUARIOS_ASIGNADOS
          );

      }

    }catch(err){

      console.error(
        "Error leyendo asignaciones",
        err
      );

    }

    window.taskAsignaciones =
      asignaciones;

    document.getElementById(
      "taskAsignacionesJson"
    ).value =

      JSON.stringify(
        asignaciones
      );

    console.log(
      "Asignaciones cargadas:",
      asignaciones
    );

    // =========================
    // IMAGEN
    // =========================

    if(task.CAPTURAS){

      const match =
        task.CAPTURAS.match(
          /[-\w]{25,}/
        );

      if(match){

        const fileId =
          match[0];

        document.getElementById(
          "previewImagenEdit"
        ).src =

          "https://lh3.googleusercontent.com/d/" +
          fileId;

        document.getElementById(
          "previewImagenEdit"
        ).style.display =
          "block";

        document.getElementById(
          "sinImagenEdit"
        ).style.display =
          "none";

        document.getElementById(
          "contenedorUploadEdit"
        ).style.display =
          "none";

        document.getElementById(
          "mensajeImagenBloqueada"
        ).classList.remove(
          "d-none"
        );
      }

    }else{

      document
        .getElementById(
          "obsImagenEdit"
        )

        .addEventListener(

          "change",

          async e => {

            const file =
              e.target.files[0];

            if(!file){
              window.taskEditImageBase64 = "";
              return;
            }

            if(typeof compressImage === "function"){
              try{
                window.taskEditImageBase64 = await compressImage(file);
              }catch(error){
                console.error("No se pudo comprimir la imagen", error);
                window.taskEditImageBase64 = "";
              }
            }

            const reader =
              new FileReader();

            reader.onload =
              ev => {

                document.getElementById(
                  "previewImagenEdit"
                ).src =
                  ev.target.result;

                document.getElementById(
                  "previewImagenEdit"
                ).style.display =
                  "block";

                document.getElementById(
                  "sinImagenEdit"
                ).style.display =
                  "none";
              };

            reader.readAsDataURL(
              file
            );
          }

        );
    }

    // =========================
    // RESUMEN
    // =========================

    actualizarResumenAsignaciones();

  }
  </script>

  <script>
  function cargarUsuariosAsignables(){

    google.script.run

      .withSuccessHandler(usuarios => {

        const tbody =

          document.querySelector(
            "#tblUsuariosAsignados tbody"
          );

        tbody.innerHTML = "";

        usuarios.forEach(user => {

          const nombre =
            user.Nombre;

          const rol =
            String(
              user.Rol_principal
            ).trim();

          const checked =
            usuarioAsignado(
              nombre,
              rol
            )

            ?

            "checked"

            :

            "";

          tbody.innerHTML += `

            <tr>

              <td>

                <input
                  type="checkbox"
                  class="chkAsignacion"

                  data-nombre="${nombre}"

                  data-rol="${rol}"

                  ${checked}
                >

              </td>

              <td>

                ${nombre}

              </td>

              <td>

                ${rol}

              </td>

            </tr>

          `;

        });

        inicializarEventosAsignacion();

        actualizarResumenAsignaciones();

      })

      .withFailureHandler(err => {

        console.error(err);

        Swal.fire({

          icon:"error",

          title:"Error",

          text:err.message

        });

      })

      .obtenerUsuariosAsignables();

  }
  </script>

  <script>
  function usuarioAsignado(
    nombre,
    rol
  ){

    const data =
      window.taskAsignaciones;

    if(
      !data ||
      !data[rol]
    ){

      return false;

    }

    return data[rol].includes(
      nombre
    );

  }
  </script>

  <script>
  function inicializarEventosAsignacion(){

    document

      .querySelectorAll(
        ".chkAsignacion"
      )

      .forEach(chk => {

        chk.addEventListener(

          "change",

          actualizarAsignaciones

        );

      });

  }
  </script>


  <script>
  function actualizarAsignaciones(){

    const asignaciones = {

      QA: [],
      DEV: [],
      PM: [],
      LIDER_QA: [],
      LIDER_DEV: []

    };

    document

      .querySelectorAll(
        ".chkAsignacion:checked"
      )

      .forEach(chk => {

        const nombre =
          chk.dataset.nombre;

        const rol =
          chk.dataset.rol;

        if(
          asignaciones[rol]
        ){

          asignaciones[rol]
            .push(nombre);

        }

      });

    window.taskAsignaciones =
      asignaciones;

    document.getElementById(
      "taskAsignacionesJson"
    ).value =

      JSON.stringify(
        asignaciones
      );

    actualizarResumenAsignaciones();

  }
  </script>

  <script>
  function actualizarResumenAsignaciones(){

    const a =
      window.taskAsignaciones || {};

    const html = `

      <b>QA:</b>
      ${(a.QA || []).join(", ") || "-"}

      <br>

      <b>DEV:</b>
      ${(a.DEV || []).join(", ") || "-"}

      <br>

      <b>PM:</b>
      ${(a.PM || []).join(", ") || "-"}

      <br>

      <b>LIDER_QA:</b>
      ${(a.LIDER_QA || []).join(", ") || "-"}

      <br>

      <b>LIDER_DEV:</b>
      ${(a.LIDER_DEV || []).join(", ") || "-"}

    `;

    document.getElementById(
      "taskResumenAsignaciones"
    ).innerHTML =
      html;

  }
  </script>

  <script>
  function eliminarTarea(id){

    Swal.fire({

      title: '¿Eliminar tarea?',

      text: `Se eliminará la tarea ${id}`,

      icon: 'warning',

      showCancelButton: true,

      confirmButtonText: 'Sí, eliminar',

      cancelButtonText: 'Cancelar',

      confirmButtonColor: '#d33'

    })

    .then(result => {

      if(!result.isConfirmed){
        return;
      }

      google.script.run

        .withSuccessHandler(() => {

          loadDashboard({
            view:'TAREAS',
            categoria:'TAREA'
          });

          Swal.fire({

            title: 'Eliminada',

            text: 'La tarea fue eliminada correctamente.',

            icon: 'success',

            showConfirmButton: false,

            timer: 2000,

            timerProgressBar: true

          });

        })

        .withFailureHandler(error => {

          Swal.fire({

            title: 'Error',

            text: error.message || String(error),

            icon: 'error',

            showConfirmButton: false,

            timer: 3000,

            timerProgressBar: true

          });

        })

        .TASK_SERVICE_delete(id);

    });

  }
  </script>


  <script>
  function tareaTieneAsignados(data){

    try{

      const asignados =

        JSON.parse(
          data.USUARIOS_ASIGNADOS || "{}"
        );

      return Object
        .values(asignados)

        .some(arr =>

          Array.isArray(arr)

          &&

          arr.length > 0
        );

    }
    catch(e){

      console.error(
        "Error validando asignados",
        e
      );

      return false;
    }

  }
  </script>

        return;

      showLoading(
