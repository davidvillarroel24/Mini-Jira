<script>

async function cargarPDFLib(){

  // =========================
  // YA CARGADO
  // =========================

  if(

    typeof PDFLib !==
    "undefined"

  ){
    return;
  }

  // =========================
  // SCRIPT
  // =========================

  await new Promise((resolve,reject)=>{

    const script =

      document.createElement(
        "script"
      );

    script.src =

      "https://cdn.jsdelivr.net/npm/pdf-lib/dist/pdf-lib.min.js";

    script.onload =
      resolve;

    script.onerror =
      reject;

    document.head
      .appendChild(script);
  });
}

</script>

<script>
function dividirTexto(

  texto,
  maxChars = 65

){

  if(!texto){
    return [];
  }

  // =========================
  // NORMALIZAR
  // =========================

  texto =

    String(texto)
      .replace(/\r/g,'');

  // =========================
  // SPLIT SALTOS REALES
  // =========================

  const bloques =

    texto.split('\n');

  const resultado = [];

  // =========================
  // RECORRER BLOQUES
  // =========================

  for(

    const bloque of bloques

  ){

    // =========================
    // LINEA VACIA
    // =========================

    if(!bloque.trim()){

      resultado.push('');
      continue;
    }

    // =========================
    // WRAP NORMAL
    // =========================

    const palabras =

      bloque.split(' ');

    let linea = '';

    for(

      const palabra of palabras

    ){

      if(

        (linea + palabra).length
        > maxChars

      ){

        resultado.push(
          linea.trim()
        );

        linea =
          palabra + ' ';

      }else{

        linea +=
          palabra + ' ';
      }
    }

    // =========================
    // PUSH FINAL
    // =========================

    if(linea.trim()){

      resultado.push(
        linea.trim()
      );
    }
  }

  return resultado;
}
</script>


<script>

async function generarPDFLib(ids){


  await cargarPDFLib();
  showLoading(
    "Generando PDF..."
  );

  

  google.script.run

    .withSuccessHandler(

      async(data)=>{

        try{

          // =========================
          // PDF DOC
          // =========================

          const pdfDoc =

            await PDFLib
              .PDFDocument
              .create();

          // =========================
          // PAGE
          // =========================

          let page =

            pdfDoc.addPage([
              595,
              842
            ]);

          // =========================
          // POSICION
          // =========================

          let y = 780;

          // =========================
          // LOOP OBS
          // =========================

          const titulo =

            "INFORME QA";

          const tituloWidth =

            titulo.length * 7;

          page.drawText(

            titulo,

            {

              x:
                (595 / 2)
                - (tituloWidth / 2),

              y:y,

              size:16
            }
          );

          y -= 25;
          page.drawText(

            `Usuario: ${data[0]?.QA || ""}`,

            {
              x:40,
              y:y,
              size:14
            }
          );

          y -= 15;

          page.drawLine({

            start:{
              x:40,
              y:y
            },

            end:{
              x:550,
              y:y
            },

            thickness:1
          });

          y -= 25;
          
          for(           

            const obs of data

          ){
            // =========================
            // BLOQUE VISUAL
            // =========================

            // =========================
            // NUEVA PAGINA
            // =========================

            if(y < 250){

              page =

                pdfDoc.addPage([
                  595,
                  842
                ]);

              y = 780;
            }

            // =========================
            // TITULO
            // =========================

            page.drawText(

              `OBSERVACION: ${obs.ID_OBSERVACION}`,

              {
                x:40,
                y:y,
                size:14
              }
            );

            y -= 25;

            // =========================
            // IMAGEN
            // =========================

            if(obs.IMAGEN_BASE64){

              try{

                const image =

                  await pdfDoc
                    .embedJpg(
                      obs.IMAGEN_BASE64
                    );

                // =========================
                // CONTENEDOR
                // =========================

                const maxWidth  = 120;
                const maxHeight = 180;

                // =========================
                // DIMENSIONES ORIGINALES
                // =========================

                const originalWidth  = image.width;
                const originalHeight = image.height;

                // =========================
                // ESCALA
                // =========================

                const scale = Math.min(

                  maxWidth  / originalWidth,

                  maxHeight / originalHeight
                );

                // =========================
                // TAMAÑO FINAL
                // =========================

                const finalWidth  =
                  originalWidth * scale;

                const finalHeight =
                  originalHeight * scale;

                // =========================
                // CENTRADO VERTICAL
                // =========================

                const offsetY =
                  (maxHeight - finalHeight) / 2;

                // =========================
                // DIBUJAR CONTENEDOR
                // =========================

                // =========================
                // IMAGEN
                // =========================

                page.drawImage(

                  image,

                  {

                    x:40,

                    y:
                      y - 210 + offsetY,

                    width:finalWidth,

                    height:finalHeight
                  }
                );

              }catch(err){

                console.error(err);
              }
            }
            // =========================
            // POSICION TEXTO
            // =========================

            const textX = 170;

            let textY = y;

            // =========================
            // MODULO
            // =========================

            page.drawText(

              `Modulo: ${obs.MODULO || ""}`,

              {
                x:textX,
                y:textY,
                size:12
              }
            );

            textY -= 25;

            // =========================
            // ESTADO
            // =========================

            page.drawText(

              `Estado: ${obs.ESTADO || ""}`,

              {
                x:textX,
                y:textY,
                size:12
              }
            );

            textY -= 25;

            // =========================
            // PRIORIDAD
            // =========================

            page.drawText(

              `Prioridad: ${obs.PRIORIDAD || ""}`,

              {
                x:textX,
                y:textY,
                size:12
              }
            );

            textY -= 35;

            // =========================
            // DESCRIPCION
            // =========================

            page.drawText(

              `Descripcion:`,

              {
                x:textX,
                y:textY,
                size:12
              }
            );

            textY -= 20;

            // =========================
            // TEXTO WRAP
            // =========================

            const descripcionLineas =

              dividirTexto(

                obs.DESCRIPCION_CORTA,

                90
              );

            for(

              const linea of descripcionLineas

            ){

              page.drawText(

                linea,

                {
                  x:textX,
                  y:textY,
                  size:10
                }
              );

              textY -= 14;
            }

            // =========================
            // ESPACIO
            // =========================

            textY -= 15;

            // =========================
            // PASOS
            // =========================

            page.drawText(

              `Pasos:`,

              {
                x:textX,
                y:textY,
                size:12
              }
            );

            textY -= 20;

            // =========================
            // PASOS TEXTO
            // =========================

            const pasosLineas =

              dividirTexto(

                obs.PASOS_REPRODUCIR,

                90
              );

            for(

              const linea of pasosLineas

            ){

              page.drawText(

                linea,

                {
                  x:textX,
                  y:textY,
                  size:10
                }
              );

              textY -= 14;              
            }

            // =========================
            // NUEVA POSICION GLOBAL
            // =========================

            y = Math.min(

              y - 240,

              textY - 40
            );
          }
          // =========================
          // SAVE PDF
          // =========================

          const pdfBytes =

            await pdfDoc.save();

          // =========================
          // BLOB
          // =========================

          const blob =

            new Blob(

              [pdfBytes],

              {
                type:'application/pdf'
              }
            );

          // =========================
          // DOWNLOAD
          // =========================

          const url =

            URL.createObjectURL(
              blob
            );

          const a =

            document.createElement(
              'a'
            );

          a.href =
            url;

          const usuario =

            document.getElementById(
              "txtNavbarUser"
            )

            .innerText

            .trim()

            .replace(/\s+/g,"_");

          const rol =

            document.getElementById(
              "cmbRoles"
            )
            .value;

          const fecha =

            new Date()

              .toISOString()

              .replace(/[:.]/g,"-");

          a.download =

            `${usuario}-${rol}-${fecha}.pdf`;

          document.body
            .appendChild(a);

          a.click();

          a.remove();

          URL.revokeObjectURL(
            url
          );

          hideLoading();

        }catch(err){

          hideLoading();

          console.error(err);

          Swal.fire({

            icon:'error',

            title:'PDF Error',

            text:err.message
          });
        }
      }
    )

    .withFailureHandler(err => {

      hideLoading();

      console.error(err);

      Swal.fire({

        icon:'error',

        title:'Backend Error',

        text:err.message
      });

    })

    .obtenerDataPDF(ids);
}

</script>
