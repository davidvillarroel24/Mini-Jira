<div class="container-fluid p-4">

  <div class="card shadow">

    <div class="card-header d-flex justify-content-between">

      <h4>
        Editar Tarea
      </h4>

      <button
        class="btn btn-secondary"
        onclick="loadDashboard({
          view:'TAREAS',
          categoria:'TAREA'
        })"
      >
        Volver
      </button>

    </div>

    <div class="card-body">

      <input
        type="hidden"
        id="obsId"
      >

      <input
        type="hidden"
        id="taskAsignacionesJson"
      >

      <input
        type="hidden"
        id="obsEstadoEdit"
      >

      <div class="row g-4">

        <!-- IMAGEN -->
        <div class="col-md-4">

          <div
            class="
              border
              rounded
              p-3
              text-center
              bg-light
            "
          >

            <img
              id="previewImagenEdit"
              class="img-fluid rounded shadow-sm"
              style="
                max-height:500px;
                object-fit:contain;
                display:none;
              "
            >

            <div
              id="sinImagenEdit"
              class="text-muted"
            >
              Sin imagen
            </div>

            <div
              id="contenedorUploadEdit"
              class="mt-3"
            >

              <input
                type="file"
                id="obsImagenEdit"
                class="form-control"
                accept="image/*"
              >

            </div>

            <div
              id="mensajeImagenBloqueada"
              class="
                alert
                alert-info
                mt-3
                d-none
              "
            >
              La captura ya fue registrada y no puede modificarse.
            </div>

          </div>

        </div>

        <!-- FORMULARIO -->
        <div class="col-md-8">

          <div class="mb-3">

            <label class="form-label fw-bold">
              Módulo
            </label>

            <input
              id="obsModuloEdit"
              class="form-control"
            >

          </div>

          <div
            id="grupoDescripcion"
            class="mb-3"
          >

            <label class="form-label fw-bold">
              Descripción de la tarea
            </label>

            <textarea
              id="obsDescEdit"
              class="form-control"
              rows="5"
            ></textarea>

          </div>

          <div
            id="grupoPasos"
            class="mb-3"
          >

            <label class="form-label fw-bold">
              Detalle
            </label>

            <textarea
              id="obsPasosEdit"
              class="form-control"
              rows="7"
            ></textarea>

          </div>

          <div class="mb-3">

            <label class="form-label fw-bold">
              Prioridad
            </label>

            <select
              id="obsPrioridadEdit"
              class="form-select"
            >

              <option>
                BAJA
              </option>

              <option>
                MEDIA
              </option>

              <option>
                ALTA
              </option>

              <option>
                CRITICA
              </option>

            </select>

          </div>

          <!-- ASIGNACIONES -->
          <div
            id="seccionAsignaciones"
            class="mb-4"
          >

            <label class="form-label fw-bold">
              Usuarios asignados
            </label>

            <div
              class="table-responsive border rounded"
              style="
                max-height:300px;
                overflow-y:auto;
              "
            >

              <table
                id="tblUsuariosAsignados"
                class="
                  table
                  table-sm
                  table-bordered
                  table-hover
                  align-middle
                "
              >

                <thead
                  class="table-light"
                >

                  <tr>

                    <th
                      style="
                        width:70px;
                      "
                    >
                      ✔
                    </th>

                    <th>
                      Nombre
                    </th>

                    <th>
                      Rol
                    </th>

                  </tr>

                </thead>

                <tbody>

                </tbody>

              </table>

            </div>

          </div>

          <!-- RESUMEN -->
          <div
            id="taskResumenAsignaciones"
            class="
              alert
              alert-secondary
              mt-3
            "
          >

            Sin usuarios asignados

          </div>

          <!-- INFO -->
          <div
            id="infoAsignacion"
            class="
              alert
              alert-info
              d-none
            "
          >

          </div>

          <!-- BOTONES -->
          <div class="mt-4">

            <button
              class="btn btn-success"
              onclick="guardarEdicionTarea()"
            >
              Guardar Cambios
            </button>

          </div>

        </div>

      </div>

    </div>

  </div>

</div>
