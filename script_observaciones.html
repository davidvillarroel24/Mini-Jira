<script>

console.log("script_observaciones cargado");

let IMAGE_BASE64 = "";

/* =========================
   PREVIEW + COMPRESION
========================= */

document.addEventListener(
  "change",
  async function(e){

    if(e.target.id !== "obsImagen"){
      return;
    }

    const file = e.target.files[0];

    if(!file){
      return;
    }

    const compressed =
      await compressImage(file);

    IMAGE_BASE64 = compressed;

    document
      .getElementById("previewImagen")
      .src = compressed;

    document
      .getElementById("previewImagen")
      .style.display = "block";
  }
);

/* =========================
   COMPRESS IMAGE
========================= */

function compressImage(file){

  return new Promise((resolve)=>{

    const reader = new FileReader();

    reader.readAsDataURL(file);

    reader.onload = function(event){

      const img = new Image();

      img.src = event.target.result;

      img.onload = function(){

        const canvas =
          document.createElement("canvas");

        const MAX_WIDTH = 1200;

        let width = img.width;
        let height = img.height;

        if(width > MAX_WIDTH){

          height *= MAX_WIDTH / width;
          width = MAX_WIDTH;
        }

        canvas.width = width;
        canvas.height = height;

        const ctx =
          canvas.getContext("2d");

        ctx.drawImage(
          img,
          0,
          0,
          width,
          height
        );

        // calidad 0.5 = muy liviano
        const compressed =
          canvas.toDataURL(
            "image/jpeg",
            0.5
          );

        resolve(compressed);
      };
    };
  });
}

/* =========================
   GUARDAR
========================= */

}

<script>

function cargarDatosObservacion(obs){

  window.obsActual = obs;
  window.obsEditImageBase64 = "";

  document.getElementById(
    "obsId"
  ).value =
    obs.ID_OBSERVACION;

  document.getElementById(
    "obsModuloEdit"
  ).value =
    obs.MODULO || "";

  document.getElementById(
    "obsDescEdit"
  ).value =
    obs.DESCRIPCION_CORTA || "";

  document.getElementById(
    "obsPasosEdit"
  ).value =
    obs.PASOS_REPRODUCIR || "";

  document.getElementById(
    "obsPrioridadEdit"
  ).value =
    obs.PRIORIDAD || "MEDIA";


  console.log(
    "script_observaciones cargado"
  );
  
  // =========================
  // IMAGEN
  // =========================

  if(obs.CAPTURAS){

    const match =
      obs.CAPTURAS.match(
        /[-\w]{25,}/
      );

    if(match){

      const fileId =
        match[0];

      document.getElementById(
        "previewImagenEdit"
      ).src =

        "https://lh3.googleusercontent.com/d/" +
            fileId;

      document.getElementById(
        "previewImagenEdit"
      ).style.display =
        "block";

      document.getElementById(
        "sinImagenEdit"
      ).style.display =
        "none";

      document.getElementById(
        "contenedorUploadEdit"
      ).style.display =
        "none";

      document.getElementById(
        "mensajeImagenBloqueada"
      ).classList.remove(
        "d-none"
      );
    }

  }else{

    document
      .getElementById(
        "obsImagenEdit"
      )

      .addEventListener(
        "change",

        async e => {

          const file =
            e.target.files[0];

          if(!file){
            window.obsEditImageBase64 = "";
            return;
          }

          if(typeof compressImage === "function"){
            try{
              window.obsEditImageBase64 = await compressImage(file);
            }catch(error){
              console.error("No se pudo comprimir la imagen", error);
              window.obsEditImageBase64 = "";
            }
          }

          const reader =
            new FileReader();

          reader.onload =
            ev => {

              document.getElementById(
                "previewImagenEdit"
              ).src =
                ev.target.result;

              document.getElementById(
                "previewImagenEdit"
              ).style.display =
                "block";

              document.getElementById(
                "sinImagenEdit"
              ).style.display =
                "none";
            };

          reader.readAsDataURL(
            file
          );
        }
      );
  }

}

</script>

<script>
function cargarHistorialComentarios(obs){

  const contenedor =

    document.getElementById(
      "txtHistorialComentarios"
    );

  let comentarios = [];

  try{

    comentarios =
      JSON.parse(
        obs.COMENTARIO_JSON || "[]"
      );

  }catch(e){

    comentarios = [];
  }

  let html = "";

  comentarios.forEach(c => {

    const color = {

      QA:
        "bg-primary-subtle",

      DEV:
        "bg-success-subtle",

      LIDER_QA:
        "bg-warning-subtle",

      LIDER_DEV:
        "bg-info-subtle",

      PM:
        "bg-secondary-subtle"

    }[c.rol] || "bg-white";

    let badge = "";

    if(c.accion === "EN_REVISION"){

      badge =

        `<span
          class="
            badge
            bg-warning
            ms-2
          "
        >
          EN REVISION
        </span>`;
    }

    if(c.accion === "APROBADO"){

      badge =

        `<span
          class="
            badge
            bg-success
            ms-2
          "
        >
          APROBADO
        </span>`;
    }

    if(c.accion === "RECHAZADO"){

      badge =

        `<span
          class="
            badge
            bg-danger
            ms-2
          "
        >
          RECHAZADO
        </span>`;
    }

    html += `

      <div
        class="
          ${color}
          p-2
          rounded
          shadow-sm
          mb-2
        "
      >

        <div
          class="
            d-flex
            justify-content-between
            align-items-center
            mb-1
          "
        >

          <div>

            <strong>
              ${c.usuario}
            </strong>

            <small
              class="text-muted"
            >
              (${c.rol})
            </small>

            ${badge}

          </div>

          <small
            class="text-muted"
          >
            ${c.fecha}
          </small>

        </div>

        <div
          style="
            white-space:pre-wrap;
            word-break:break-word;
            line-height:1.2;
          "
        >
          ${escapeHtml(c.mensaje)}
        </div>

      </div>

    `;
  });

  if(!html){

    html = `

      <div
        class="
          text-center
          text-muted
          mt-5
        "
      >

        Sin comentarios

      </div>

    `;
  }

  contenedor.innerHTML = html;

  contenedor.scrollTop =
    contenedor.scrollHeight;
}

</script>

<script>
async function enviarComentario(){

  const mensaje =

    document
      .getElementById(
        "txtNuevoComentario"
      )
      .value
      .trim();

  if(!mensaje){

    Swal.fire({

      icon:"warning",

      title:"Mensaje vacío",

      text:
        "Debe escribir un comentario.",

      timer:1500,

      showConfirmButton:false

    });

    return;
  }

  showLoading(
    "Guardando comentario..."
  );

  try{

    const usuario =

      document
        .getElementById(
          "txtNavbarUser"
        )
        .innerText
        .trim();

    const rol =

      document
        .getElementById(
          "cmbRoles"
        )
        .value;

    const id =

      document
        .getElementById(
          "chatObsId"
        )
        .value;

    const pendingMove =

      window.kanbanPendingMove

      &&

      String(window.kanbanPendingMove.id || "")
        .trim()

      ===

      String(id)
        .trim()

      ?

      window.kanbanPendingMove

      :

      null;

    const obs =

      await obtenerRegistro(id)
      //await obtenerObservacion(id);

    console.log ("observaciiones",obs)
    
    const payload = {

      id,

      usuario,

      rol,

      mensaje:
        mensaje

          .replace(/\r/g, "")

          .replace(
            /\n{3,}/g,
            "\n\n"
          )

          .trim(),

      marcarRevision:false,

      aprobarCorreccion:false,

      rechazarCorreccion:false

    };

    // =====================
    // DEV ASIGNADO
    // =====================

    //const esDevAsignado =
//
    //  rol === "DEV"
//
    //  &&
//
    //  usuario ===
    //  obs.DEV_ASIGNADO;

    const esDevAsignado =

      obs.DEV_ASIGNADO

      ?

      (

        rol === "DEV"

        &&

        String(usuario)
          .trim()
          .toUpperCase()

        ===

        String(obs.DEV_ASIGNADO)
          .trim()
          .toUpperCase()

      )

      :

      (

        rol === "DEV"

        &&

        usuarioAsignadoEnRol(

          obs,

          usuario,

          "DEV"

        )

      );

    if(

      esDevAsignado

      &&

      obs.ESTADO !==
      "EN_REVISION"

    ){

      const result =

        await Swal.fire({

          title:
            "¿Marcar como listo para revisión?",

          text:
            "La observación cambiará a EN_REVISION.",

          icon:"question",

          showCancelButton:true,

          confirmButtonText:
            "Sí",

          cancelButtonText:
            "No"

        });

      payload.marcarRevision =
        result.isConfirmed;
    }

    // =====================
    // QA / LIDERES / PM
    // =====================

    //const esQaAsignado =
//
    //  rol === "QA"
//
    //  &&
//
    //  usuario ===
    //  obs.QA;
//
    const esQaAsignado =

      rol === "QA"

      &&

      esQaValidador(
        obs,
        usuario
      );
      
    const puedeValidar =

      esQaAsignado

      ||

      [

        "LIDER_QA",

        "LIDER_DEV",

        "PM"

      ].includes(
        rol
      );

    if(

      puedeValidar

      &&

      obs.ESTADO ===
      "EN_REVISION"

    ){

      const result =

        await Swal.fire({

          title:
            "Validación",

          text:
            "¿Aceptar o rechazar la corrección?",

          icon:"question",

          showDenyButton:true,

          showCancelButton:true,

          confirmButtonText:
            "Aceptar",

          denyButtonText:
            "Rechazar",

          cancelButtonText:
            "Solo comentar"

        });

      if(
        result.isConfirmed
      ){

        payload.aprobarCorreccion =
          true;
      }

      else if(
        result.isDenied
      ){

        payload.rechazarCorreccion =
          true;
      }
    }

    const tipo =

      document
        .getElementById(
          "chatTipo"
        )
        .value;

    await runServer(

      tipo === "TAREA"

      ?

      "TASK_SERVICE_addComment"

      :

      "OBS_SERVICE_addComment",

      payload

    );

    let cambioEstadoAplicado = false;

    if(pendingMove && tipo === "TAREA"){

      try{

        await runServer(

          "KANBAN_moveItem",

          {
            id: id,
            oldState: pendingMove.oldState,
            newState: pendingMove.newState
          },

          typeof getClientUserContext === "function"

            ?

            getClientUserContext()

            :

            null

        );

        cambioEstadoAplicado = true;

      }
      catch(moveError){

        console.error(moveError);

        Swal.fire({

          icon:"warning",

          title:"Comentario guardado",

          text:
            "No se pudo cambiar el estado en Kanban: "

            +

            (moveError && moveError.message ? moveError.message : String(moveError))

        });

      }
      finally{

        window.kanbanPendingMove = null;

      }
    }


    //await runServer(

      //"OBS_SERVICE_addComment",

      //payload

    //);

    showLoading(
      "Actualizando historial..."
    );

    const obsActualizada =

      await obtenerRegistro(id);
      //await obtenerObservacion(id);

    console.log("observaciones actualizado: ",obsActualizada)

    document
      .getElementById(
        "txtNuevoComentario"
      )
      .value = "";

    
    cargarInfoComentarios(
      obsActualizada
    );

    cargarHistorialComentarios(
      obsActualizada
    );

    Swal.fire({

      icon:"success",

      title:
        cambioEstadoAplicado

        ?

        "Comentario y cambio de estado guardados"

        :

        "Comentario guardado",

      timer:1200,

      showConfirmButton:false

    });

    if(cambioEstadoAplicado && window.currentAppView === "KANBAN" && typeof refreshKanban === "function"){

      bootstrap.Modal

        .getOrCreateInstance(
          document.getElementById(
            "modalComentarios"
          )
        )

        .hide();

      refreshKanban({

        sprintId:
          window.kanbanState && window.kanbanState.sprintId

          ?

          window.kanbanState.sprintId

          :

          "TODOS",

        onlyMine:
          window.kanbanState

          ?

          !!window.kanbanState.onlyMine

          :

          false

      });

    }

  }
  catch(error){

    console.error(error);

    Swal.fire({

      icon:"error",

      title:"Error",

      text:error.message

    });

  }
  finally{

    hideLoading();

  }
}
</script>

      .getElementById(

      )
      .value;

  return new Promise(

    (resolve,reject) => {

      const runner =

        google.script.run

          .withSuccessHandler(
            resolve
          )

          .withFailureHandler(
            reject
          );

      if(tipo === "TAREA"){

        runner.getTareaById(id);

      }else{

        runner.getObservacionById(id);

      }

    }

  );

}
</script>

<script>
function usuarioAsignadoEnRol(
  obs,
  nombre,
  rol
){

  try{

    const asignados =

      JSON.parse(
        obs.USUARIOS_ASIGNADOS || "{}"
      );

    return (

      asignados[rol] || []

    ).some(usuario =>

      String(usuario)
        .trim()
        .toUpperCase()

      ===

      String(nombre)
        .trim()
        .toUpperCase()

    );

  }
  catch(error){

    return false;

  }

}
</script>

<script>
function esQaValidador(
  obs,
  usuario
){

  const qas = [];

  // =====================
  // QA CREADOR
  // =====================

  if(obs.QA){

    qas.push(
      String(obs.QA)
        .trim()
        .toUpperCase()
    );

  }

  // =====================
  // QA ASIGNADOS
  // =====================

  try{

    const asignados =

      JSON.parse(
        obs.USUARIOS_ASIGNADOS || "{}"
      );

    (asignados.QA || [])

      .forEach(nombre => {

        qas.push(

          String(nombre)
            .trim()
            .toUpperCase()

        );

      });

  }
  catch(error){

    console.error(error);

  }

  return qas.includes(

    String(usuario)
      .trim()
      .toUpperCase()

  );

}
</script>
